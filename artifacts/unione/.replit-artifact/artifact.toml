kind = "web"
previewPath = "/"
title = "UniOne"
description = "A centralized university admissions portal for students in Pakistan to build a reusable profile, discover universities and programs, and shortlist opportunities for later applications."
version = "1.0.0"
id = "artifacts/unione"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26195

[services.development]
run = "pnpm --filter @workspace/unione run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/unione", "run", "build" ]
serve = "static"
publicDir = "artifacts/unione/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26195"
BASE_PATH = "/"
